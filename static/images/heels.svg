<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Nude leather pump">
	<defs>
		<linearGradient id="hlsBg" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0%" stop-color="#FDFBF7" />
			<stop offset="100%" stop-color="#F3ECE0" />
		</linearGradient>
	</defs>
	<rect width="800" height="800" fill="url(#hlsBg)" />
	<g transform="translate(400 430)">
		<!-- upper: vamp sweeping from the pointed toe up to the heel counter -->
		<path
			d="M-260 120
			   C -262 40, -190 26, -120 6
			   C -40 -18, 40 -60, 110 -122
			   C 150 -158, 186 -152, 190 -110
			   L 200 20
			   C 202 60, 218 92, 236 116
			   Z"
			fill="#E8DAC4"
			stroke="#C4AC88"
			stroke-width="10"
			stroke-linejoin="round"
		/>
		<!-- topline shadow -->
		<path
			d="M-120 6 C -40 -18, 40 -60, 110 -122"
			fill="none"
			stroke="#C4AC88"
			stroke-width="8"
			stroke-linecap="round"
			opacity="0.8"
		/>
		<!-- stiletto heel -->
		<path d="M196 116 L232 240 q4 22 -20 22 h-14 q-22 0 -18 -22 z" fill="#D8C4A8" stroke="#98763E" stroke-width="8" stroke-linejoin="round" />
		<!-- sole -->
		<path d="M-268 116 h500 q22 0 22 24 t-22 24 h-500 q-22 0 -22 -24 t22 -24 z" fill="#FFFDF9" stroke="#C4AC88" stroke-width="9" />
	</g>
</svg>
